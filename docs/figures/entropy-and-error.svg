 <title>Final entropy and curve error in recorded virtual MAPK experiments</title><desc>Scatter plot of 20 grid-matched generating points and six noise repeats at one off-grid point, using variance-guided selection at budget 12. Entropy measures allowed-hypothesis weight dispersion; curve RMSE compares predictions with the hidden noiseless trajectory. Different truth scenarios prevent interpreting the between-group contrast as a causal effect of grid mismatch.</desc><metadata>
