<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img">
<title>Data access in the implemented virtual MAPK measurement loop</title>
<desc>A hidden simulator supplies only the selected noisy observation. A posterior update changes weights over 49 allowed hypotheses, and the policy uses those weights and predicted means to select another candidate. Only the evaluator receives the hidden noiseless curve. The diagram is a software-data-access schematic, not laboratory equipment.</desc>
<rect width="960" height="730" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#596773"/></marker></defs>
<text x="480" y="36" font-size="26" fill="#203449" font-weight="bold" text-anchor="middle">What the selection policy can and cannot see</text>
<text x="480" y="66" font-size="17" fill="#596773" font-weight="normal" text-anchor="middle">Implemented software loop — all observations are simulated</text>
<rect x="50" y="105" width="360" height="125" rx="12" fill="white" stroke="#B87824" stroke-width="2"/><text x="230" y="135" font-size="20" fill="#B87824" font-weight="bold" text-anchor="middle">Hidden simulator</text><text x="230" y="166" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">One generating parameter setting</text><text x="230" y="191" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Candidate-indexed noisy observations</text><text x="230" y="216" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Hidden noiseless evaluation curve</text>
<rect x="550" y="105" width="360" height="125" rx="12" fill="white" stroke="#386CB0" stroke-width="2"/><text x="730" y="135" font-size="20" fill="#386CB0" font-weight="bold" text-anchor="middle">Allowed model predictions</text><text x="730" y="166" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">49 hypotheses; 72 candidates</text><text x="730" y="191" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Fixed model and known noise scale</text><text x="730" y="216" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Available before selection</text>
<rect x="50" y="310" width="360" height="100" rx="12" fill="white" stroke="#007F7B" stroke-width="2"/><text x="230" y="340" font-size="20" fill="#007F7B" font-weight="bold" text-anchor="middle">Revealed observation</text><text x="230" y="371" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">One selected candidate ID and value</text><text x="230" y="396" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Earlier observations remain available</text>
<rect x="550" y="310" width="360" height="100" rx="12" fill="white" stroke="#007F7B" stroke-width="2"/><text x="730" y="340" font-size="20" fill="#007F7B" font-weight="bold" text-anchor="middle">Posterior update</text><text x="730" y="371" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Weights over the allowed hypotheses</text><text x="730" y="396" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Conditional on model, grid and noise</text>
<rect x="300" y="505" width="360" height="100" rx="12" fill="white" stroke="#386CB0" stroke-width="2"/><text x="480" y="535" font-size="20" fill="#386CB0" font-weight="bold" text-anchor="middle">Selection policy</text><text x="480" y="566" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Predicted means + current weights</text><text x="480" y="591" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Selected IDs; no hidden truth</text>
<path d="M230,230 L230,310" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="230" y="262" font-size="16" fill="#596773" font-weight="normal" text-anchor="middle">reveal selected value</text>
<path d="M410,360 L550,360" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="480" y="338" font-size="16" fill="#596773" font-weight="normal" text-anchor="middle">update</text>
<path d="M730,230 L730,310" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M730,410 L730,465 L590,505" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M370,505 L230,465 L230,410" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="335" y="455" font-size="16" fill="#596773" font-weight="normal" text-anchor="middle">next query ID</text>
<rect x="50" y="625" width="860" height="70" rx="12" fill="white" stroke="#B87824" stroke-width="2"/><text x="480" y="655" font-size="20" fill="#B87824" font-weight="bold" text-anchor="middle">Evaluator only</text><text x="480" y="686" font-size="17" fill="#203449" font-weight="normal" text-anchor="middle">Hidden curve + posterior predictions → curve error; weights → entropy</text>
<path d="M50,165 L25,165 L25,660 L50,660" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path d="M730,410 L935,410 L935,660 L910,660" fill="none" stroke="#596773" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="480" y="720" font-size="16" fill="#596773" font-weight="normal" text-anchor="middle">Solid arrows: learning loop. Dashed arrows: evaluation access, never policy input.</text>
</g></svg>
