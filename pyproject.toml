[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapk-dynamics-lab"
version = "0.1.0"
description = "A reproducible finite-hypothesis MAPK simulation and virtual observation-design benchmark"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "pandas==2.2.3", "matplotlib==3.10.8"]

[tool.setuptools]
packages = ["mapk_lab"]
