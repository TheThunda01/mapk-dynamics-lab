name: numerical checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_benchmark.py --out .reproduction
      - run: python scripts/verify_results.py --results-dir .reproduction
      - run: python scripts/compare_results.py results .reproduction
